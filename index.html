        <script>
            const body = document.body;
            const trigger = document.getElementById('logoTrigger');
            const logoStack = document.querySelector('.logo-stack');
            const subtitle = document.getElementById('subtitle');
            const siteHeader = document.getElementById('siteHeader');
            const navToggle = document.getElementById('navToggle');
            const siteNav = document.getElementById('siteNav');

            const idleOpenDelay = 6000;
            const activeDuration = 3000;
            const hoverLeaveGrace = 50;

            let hoverCount = 0;
            let idleOpenTimer = null;
            let idleCloseTimer = null;
            let hoverLeaveTimer = null;
            let manualOpen = false;

            const clearIdleTimers = () => {
                window.clearTimeout(idleOpenTimer);
                window.clearTimeout(idleCloseTimer);
                idleOpenTimer = null;
                idleCloseTimer = null;
            };

            const cancelHoverLeave = () => {
                window.clearTimeout(hoverLeaveTimer);
                hoverLeaveTimer = null;
            };

            const openGallery = () => {
                body.classList.add('gallery-open');
            };

            const closeGallery = () => {
                if (!manualOpen) {
                    body.classList.remove('gallery-open');
                }
            };

            const scheduleIdleAnimation = () => {
                clearIdleTimers();

                if (hoverCount > 0 || manualOpen) {
                    return;
                }

                idleOpenTimer = window.setTimeout(() => {
                    if (hoverCount > 0 || manualOpen) {
                        return;
                    }

                    openGallery();

                    idleCloseTimer = window.setTimeout(() => {
                        if (hoverCount > 0 || manualOpen) {
                            return;
                        }

                        closeGallery();
                        scheduleIdleAnimation();
                    }, activeDuration);
                }, idleOpenDelay);
            };

            const startHover = () => {
                hoverCount += 1;
                cancelHoverLeave();
                clearIdleTimers();
                openGallery();
            };

            const endHover = () => {
                hoverCount = Math.max(0, hoverCount - 1);

                if (hoverCount > 0) {
                    return;
                }

                cancelHoverLeave();
                hoverLeaveTimer = window.setTimeout(() => {
                    if (hoverCount > 0 || manualOpen) {
                        return;
                    }

                    closeGallery();
                    scheduleIdleAnimation();
                }, hoverLeaveGrace);
            };

            logoStack.addEventListener('mouseenter', startHover);
            logoStack.addEventListener('focusin', startHover);
            logoStack.addEventListener('mouseleave', endHover);
            logoStack.addEventListener('focusout', endHover);

            scheduleIdleAnimation();

            trigger.addEventListener('click', () => {
                if (body.classList.contains('gallery-open')) {
                    manualOpen = false;
                    clearIdleTimers();
                    cancelHoverLeave();
                    closeGallery();
                    if (hoverCount === 0) {
                        scheduleIdleAnimation();
                    }
                } else {
                    manualOpen = true;
                    clearIdleTimers();
                    cancelHoverLeave();
                    openGallery();
                }
            });

            const subtitleRoles = ['Interactive Media Designer', 'Graphic Designer', 'UI/UX Designer'];
            const subtitleSwitchDelay = 2600;
            const subtitleFadeDuration = 180;
            let subtitleRoleIndex = 0;

            const switchSubtitleRole = () => {
                if (!subtitle) {
                    return;
                }

                subtitle.classList.add('is-switching');

                window.setTimeout(() => {
                    subtitleRoleIndex = (subtitleRoleIndex + 1) % subtitleRoles.length;
                    subtitle.textContent = subtitleRoles[subtitleRoleIndex];
                    subtitle.classList.remove('is-switching');
                }, subtitleFadeDuration);
            };

            if (subtitle) {
                subtitle.textContent = subtitleRoles[0];
                window.setInterval(switchSubtitleRole, subtitleSwitchDelay);
            }

            const openNav = () => {
                body.classList.add('nav-open');
                navToggle?.setAttribute('aria-expanded', 'true');
                siteNav?.setAttribute('aria-hidden', 'false');
            };

            const closeNav = () => {
                body.classList.remove('nav-open');
                navToggle?.setAttribute('aria-expanded', 'false');
                siteNav?.setAttribute('aria-hidden', 'true');
            };

            navToggle?.addEventListener('click', () => {
                if (body.classList.contains('nav-open')) {
                    closeNav();
                } else {
                    openNav();
                }
            });

            siteNav?.addEventListener('click', (event) => {
                if (event.target instanceof HTMLAnchorElement) {
                    closeNav();
                }
            });

        </script>

        <script>
            const galleryCards = Array.from(document.querySelectorAll('.gallery-card'));

            const clamp01 = (value) => Math.max(0, Math.min(1, value));

            const updateReveal = (card, state, event) => {
                const rect = card.getBoundingClientRect();
                const pointerX = clamp01((event.clientX - rect.left) / rect.width);
                const pointerY = clamp01((event.clientY - rect.top) / rect.height);
                const revealSize = Math.max(8, Math.min(44, 8 + (1 - Math.min(pointerX, 1 - pointerX, pointerY, 1 - pointerY)) * 36));

                state.revealX = `${(pointerX * 100).toFixed(2)}%`;
                state.revealY = `${(pointerY * 100).toFixed(2)}%`;
                state.revealSize = `${revealSize.toFixed(2)}%`;

                card.style.setProperty('--reveal-x', state.revealX);
                card.style.setProperty('--reveal-y', state.revealY);
                card.style.setProperty('--reveal-size', state.revealSize);
            };

            const activateCard = (card, state, event) => {
                window.clearTimeout(state.hideTimer);
                state.active = true;
                card.classList.add('is-active');

                if (event) {
                    updateReveal(card, state, event);
                }

                if (!state.revealSize || state.revealSize === '0%') {
                    state.revealSize = '56%';
                    card.style.setProperty('--reveal-size', state.revealSize);
                }
            };

            const deactivateCard = (card, state) => {
                state.active = false;
                card.style.setProperty('--reveal-size', '0%');

                state.hideTimer = window.setTimeout(() => {
                    if (!state.active) {
                        card.classList.remove('is-active');
                    }
                }, 220);
            };

            galleryCards.forEach((card) => {
                const state = {
                    active: false,
                    hideTimer: null,
                    revealX: '50%',
                    revealY: '50%',
                    revealSize: '0%',
                };

                card.style.setProperty('--reveal-x', state.revealX);
                card.style.setProperty('--reveal-y', state.revealY);
                card.style.setProperty('--reveal-size', state.revealSize);

                const enterHandler = (event) => {
                    if (event.pointerType === 'touch') {
                        return;
                    }

                    activateCard(card, state, event);
                };

                const moveHandler = (event) => {
                    if (!card.classList.contains('is-active') || event.pointerType === 'touch') {
                        return;
                    }

                    updateReveal(card, state, event);
                };

                const leaveHandler = () => {
                    deactivateCard(card, state);
                };

                card.addEventListener('pointerenter', enterHandler);
                card.addEventListener('mouseenter', enterHandler);
                card.addEventListener('pointermove', moveHandler);
                card.addEventListener('mousemove', moveHandler);
                card.addEventListener('pointerleave', leaveHandler);
                card.addEventListener('mouseleave', leaveHandler);

                card.addEventListener('focus', () => {
                    activateCard(card, state);
                });

                card.addEventListener('blur', () => {
                    deactivateCard(card, state);
                });

                const openWorkSection = () => {
                    const target = card.dataset.workTarget;

                    if (!target) {
                        return;
                    }

                    window.location.href = `work.html#${target}`;
                };

                card.addEventListener('click', openWorkSection);

                card.addEventListener('keydown', (event) => {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        openWorkSection();
                    }
                });
            });
        </script>

            const contactForm = document.querySelector('.contact__form');
            const countrySelect = contactForm?.querySelector('select[name="country"]');

            const emailInput = contactForm?.querySelector('input[name="email"]');
            const phoneNumberInput = contactForm?.querySelector('input[name="phoneNumber"]');
            const emailjsServiceId = 'service_6ygsqml';
            const emailjsTemplateId = 'template_ap85w7g';

            emailjs.init('xy63ham7GBjco2Bii');

            const flagEmoji = (regionCode) => {
                if (!regionCode || regionCode.length !== 2) {
                    return '';
                }

                return String.fromCodePoint(...regionCode.toUpperCase().split('').map((char) => 127397 + char.charCodeAt(0)));
            };

            const populateLocationSelects = async () => {
                if (!countrySelect || !phoneCodeSelect) {
                    return;
                }

                const response = await fetch('https://restcountries.com/v3.1/all?fields=name,cca2,idd');
                const countries = await response.json();

                const sortedCountries = countries
                    .filter((country) => country?.name?.common && country?.cca2)
                    .sort((left, right) => left.name.common.localeCompare(right.name.common, 'en'));

                countrySelect.innerHTML = '<option value="" selected disabled>Select your Country</option>';
                phoneCodeSelect.innerHTML = '<option value="" selected disabled>Code</option>';

                sortedCountries.forEach((country) => {
                    const flag = flagEmoji(country.cca2);

                    const countryOption = document.createElement('option');
                    countryOption.value = country.cca2;
                    countryOption.textContent = `${flag} ${country.name.common}`;
                    countrySelect.appendChild(countryOption);

                    const root = country.idd?.root || '';
                    const suffixes = Array.isArray(country.idd?.suffixes) && country.idd.suffixes.length > 0 ? country.idd.suffixes : [''];

                    if (!root) {
                        return;
                    }

                    suffixes.forEach((suffix) => {
                        const dialCode = `${root}${suffix}`;
                        const phoneOption = document.createElement('option');
                        phoneOption.value = dialCode;
                        phoneOption.dataset.region = country.cca2;
                        phoneOption.textContent = `${flag} ${country.name.common} (${dialCode})`;
                        phoneCodeSelect.appendChild(phoneOption);
                    });
                });
            };

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

            const validateEmailDomain = async () => {
                if (!emailInput) {
                    return false;
                }

                const value = emailInput.value.trim();
                emailInput.setCustomValidity('');

                if (!value) {
                    emailInput.setCustomValidity('Enter your email address.');
                    return false;
                }

                if (!emailPattern.test(value)) {
                    emailInput.setCustomValidity('Enter a valid email format.');
                    return false;
                }

                const domain = value.split('@')[1];

                try {
                    const response = await fetch(`https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=MX`);
                    const data = await response.json();

                    if (data.Status !== 0 || !Array.isArray(data.Answer) || data.Answer.length === 0) {
                        emailInput.setCustomValidity('That email domain does not look valid.');
                        return false;
                    }
                } catch {
                    return true;
                }

                return true;
            };

            const validatePhoneNumber = () => {
                if (!phoneNumberInput) {
                    return false;
                }

                const digitsOnly = phoneNumberInput.value.replace(/\D/g, '');
                const dialCode = phoneCodeSelect?.value || '';
                const fullNumber = `${dialCode}${digitsOnly}`;

                let valid = digitsOnly.length >= 6 && digitsOnly.length <= 15;

                if (window.libphonenumber?.parsePhoneNumberFromString && dialCode) {
                    const parsed = window.libphonenumber.parsePhoneNumberFromString(fullNumber);
                    valid = Boolean(parsed && parsed.isValid());
                }

                phoneNumberInput.setCustomValidity(valid ? '' : 'Enter a valid phone number.');
                return valid;
            };

            populateLocationSelects().catch(() => {});

            emailInput?.addEventListener('blur', async () => {
                await validateEmailDomain();
                emailInput.reportValidity();
            });

            phoneNumberInput?.addEventListener('input', validatePhoneNumber);
            phoneCodeSelect?.addEventListener('change', validatePhoneNumber);

            contactForm?.addEventListener('submit', async (event) => {
                event.preventDefault();

                const emailValid = await validateEmailDomain();
                const phoneValid = validatePhoneNumber();

                if (!contactForm.reportValidity() || !emailValid || !phoneValid) {
                    return;
                }

                const formData = new FormData(contactForm);

                try {
                    await emailjs.send(emailjsServiceId, emailjsTemplateId, {
                        from_name: String(formData.get('name') || '').trim(),
                        reply_to: String(formData.get('email') || '').trim(),
                        country: String(formData.get('country') || '').trim(),
                        phone_code: String(formData.get('phoneCode') || '').trim(),
                        phone_number: String(formData.get('phoneNumber') || '').trim(),
                        message: String(formData.get('message') || '').trim(),
                    });

                    contactForm.reset();
                } catch (error) {
                    console.error('EmailJS send failed', error);
                    alert('Unable to send your message right now. Please try again later.');
                }
            });

            const contactTitle = document.getElementById('contactTitle');
            const contactSubmit = document.querySelector('.contact__submit');

            const setContactGradientState = (isActive) => {
                document.body.classList.toggle('contact-submit-hover', isActive);

                if (!isActive || !contactTitle) {
                    return;
                }

                document.body.style.setProperty('--contact-title-gradient-position', '0%');
            };

            contactSubmit?.addEventListener('mouseenter', () => setContactGradientState(true));
            contactSubmit?.addEventListener('mouseleave', () => setContactGradientState(false));
            contactSubmit?.addEventListener('focus', () => setContactGradientState(true));
            contactSubmit?.addEventListener('blur', () => setContactGradientState(false));
        </script>
    </main>
</body>
</html>
